---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/konflux-ci/rpmbuild-pipeline-environment-container?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch
      == "main"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: oci-images
    appstudio.openshift.io/component: environment
    pipelines.appstudio.openshift.io/type: build
  name: environment-on-push
  namespace: rpm-build-pipeline-tenant
spec:
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: output-image
      value: quay.io/redhat-user-workloads/rpm-build-pipeline-tenant/environment:latest
    - name: dockerfile
      value: /Containerfile
    - name: build-platforms
      value:
        - linux/x86_64
        - linux/arm64
        - linux/ppc64le
        - linux/s390x
  pipelineRef:
    resolver: bundles
    params:
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/pipeline-docker-build-multi-platform-oci-ta@sha256:06efc469e706cf5377a44cd34280e2d08e3f8c3b63eabefc8c7882f9a55618d3
      - name: name
        value: docker-build-multi-platform-oci-ta
      - name: kind
        value: pipeline
  taskRunTemplate:
    serviceAccountName: build-pipeline-environment
  workspaces:
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
  concurrency_limit: 1
