---
name: pre-commit

on:
  push:
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    container:
      image: |
        quay.io/redhat-artifact-storage/pre-commit-image@sha256:059dbb6da3df49703fc70a7818944cef9fcab564690424acb058f117e3dbbf2c

    steps:
      - name: Repository checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: shellcheck,pylint
        with:
          extra_args: --from-ref origin/main --to-ref HEAD
